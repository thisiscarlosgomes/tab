name: Chat browser checks
on:
  pull_request:
    paths:
      - 'src/components/dinner/**'
      - 'src/lib/dinner/**'
      - 'src/app/app/**'
      - 'tests/dinner/**'
      - 'package*.json'
      - '.github/workflows/chat-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:chat-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-browser-evidence
          path: /tmp/tab-browser-controlled
          if-no-files-found: ignore
